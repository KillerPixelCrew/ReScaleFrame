[workspace]
members = ["ui/overlay", "runtime/backends/rsf-upscaler"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
repository = "https://github.com/KillerPixelCrew/ReScaleFrame"
publish = false
