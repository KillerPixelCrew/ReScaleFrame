[workspace]
members = [
  "ui/overlay",
  "tests/overlay",
  "tests/presentation",
  "tests/presentation/api",
  "tests/game-sdk",
  "runtime/backends/fsr/compat",
  "runtime/vulkan/ngx",
  "runtime/vulkan/streamline/lifecycle",
  "runtime/common",
  "runtime/graphics/submission",
  "runtime/orchestrator",
  "runtime/shader_patch/compiler",
  "loader",
  "tests/loader",
  "sdk/game",
  "games/ac7",
  "games/anomaly",
  "games/fallout4",
  "games/minecraft",
  "games/project-wingman",
  "games/rdr2",
  "games/skyrim-se",
  "games/unity-mono",
  "integrations/godot",
  "integrations/steam",
  "integrations/windows",
  "tools/exposure_probe",
]
resolver = "3"

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.94"
repository = "https://github.com/KillerPixelCrew/ReScaleFrame"
publish = false
license = "MIT"

[workspace.dependencies]
egui = "=0.35.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
