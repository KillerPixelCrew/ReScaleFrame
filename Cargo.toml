[workspace]
members = [
  "ui/overlay",
  "tests/overlay",
  "tests/overlay-service",
  "tests/support",
  "tests/capture",
  "tests/presentation",
  "tests/presentation/api",
  "tests/translucency",
  "tests/game-sdk",
  "tests/ac7-capture",
  "tests/generation",
  "tests/vulkan-fg",
  "runtime/backends/fsr/compat",
  "runtime/vulkan/fsr3",
  "runtime/vulkan/ngx",
  "runtime/vulkan/streamline/lifecycle",
  "runtime/vulkan/xess-fg",
  "runtime/common",
  "runtime/graphics/rust",
  "runtime/graphics/submission",
  "runtime/orchestrator",
  "runtime/shader_patch/compiler",
  "loader",
  "tests/loader",
  "sdk/game",
  "games/ac7",
  "games/anomaly",
  "games/fallout4",
  "games/minecraft",
  "games/project-wingman",
  "games/rdr2",
  "games/skyrim-se",
  "games/unity-mono",
  "integrations/unity",
  "integrations/godot",
  "integrations/steam",
  "integrations/windows",
  "third_party/minhook",
  "tools/exposure_probe",
  "tools/bindgen",
]
resolver = "3"

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.94"
repository = "https://github.com/KillerPixelCrew/ReScaleFrame"
publish = false
license = "MIT"

[workspace.dependencies]
ash = { version = "=0.38.0", default-features = false, features = ["std"] }
cc = "1"
windows = { version = "0.62.2", default-features = false }
windows-sys = "0.61"
egui = "=0.35.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
