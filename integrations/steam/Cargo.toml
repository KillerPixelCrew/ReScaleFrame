[package]
name = "rsf-steam"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
# The Skyrim SE and Fallout 4 archives embed it, so each DLL carries one copy of rsf-windows.
crate-type = ["rlib"]

[dependencies]
rsf-game-sys = { path = "../../sdk/game" }
rsf-windows = { path = "../windows" }

[target."cfg(windows)".dependencies.windows-sys]
workspace = true
features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
]

[build-dependencies]
cc.workspace = true

[lints]
workspace = true
