[package]
name = "rsf-capture-fixtures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib"]

[target.'cfg(windows)'.dependencies]
rsf-game-sys = { path = "../../sdk/game" }
# The Runtime the capture paths call, carried in their archives; the texture path takes only the
# graphics leaves.
rsf-graphics = { path = "../../runtime/graphics/rust", optional = true }
rsf-orchestrator = { path = "../../runtime/orchestrator", optional = true }
rsf-test-support = { path = "../support" }
ash = { workspace = true, optional = true }
windows = { workspace = true, optional = true, features = [
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Imaging",
  "Win32_System_Com",
  "Win32_Security",
] }
windows-sys = { workspace = true, features = [
  "Win32_Security",
  "Win32_Graphics_Gdi",
  "Win32_System_Environment",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[features]
metadata = ["dep:rsf-orchestrator"]
d3d12 = ["dep:rsf-orchestrator", "dep:windows"]
d3d11 = ["dep:rsf-orchestrator", "dep:windows"]
vulkan = ["dep:ash", "dep:rsf-orchestrator", "dep:windows"]
# The launcher that imports the Runtime DLL; vulkan-cpu-linked is the one linked with the Runtime.
vulkan-cpu = ["dep:ash", "dep:windows"]
vulkan-cpu-linked = ["dep:rsf-orchestrator", "vulkan-cpu"]
texture = ["dep:rsf-graphics", "dep:windows"]

[build-dependencies]
rsf-bindgen = { path = "../../tools/bindgen" }

[lints]
workspace = true
