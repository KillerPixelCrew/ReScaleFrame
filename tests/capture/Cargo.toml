[package]
name = "rsf-capture-fixtures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib"]

[target.'cfg(windows)'.dependencies]
rsf-game-sys = { path = "../../sdk/game" }
ash = { version = "=0.38.0", default-features = false, features = ["std"], optional = true }
windows = { version = "0.62.2", default-features = false, features = [
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Imaging",
  "Win32_System_Com",
  "Win32_Security",
] }
windows-sys = { version = "0.61", features = [
  "Win32_Security",
  "Win32_Graphics_Gdi",
  "Win32_System_Environment",
  "Win32_System_LibraryLoader",
  "Win32_System_Performance",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[features]
metadata = []
d3d12 = []
d3d11 = []
vulkan = ["dep:ash"]
vulkan-cpu = ["dep:ash"]
texture = []

[build-dependencies]
rsf-bindgen = { path = "../../tools/bindgen" }

[lints]
workspace = true
