[package]
name = "rsf-ac7-capture-fixture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib"]

[dependencies]
rsf-ac7 = { path = "../../games/ac7" }

[target."cfg(windows)".dependencies]
windows = { workspace = true, features = [
  "Win32_Globalization",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
] }

# Unit tests link the crates whose archives the fixture executable gets from CMake.
[target."cfg(windows)".dev-dependencies]
rsf-orchestrator = { path = "../../runtime/orchestrator" }
rsf-runtime-common = { path = "../../runtime/common" }
rsf-shader-compiler = { path = "../../runtime/shader_patch/compiler" }

[lints]
workspace = true
