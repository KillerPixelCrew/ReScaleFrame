[package]
name = "rsf-vulkan-fg-fixtures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib"]

[features]
dispatch = []
ffx = ["dep:ash"]
wsi-dispatch = ["dep:ash"]
fsr4-state = ["dep:ash"]
dlss = ["dep:ash"]
streamline-selected = []
streamline-dispatch = ["dep:ash"]
xess-sr = ["dep:ash", "dep:windows-sys"]
xess-device = [
  "dep:ash", "dep:windows-sys", "windows-sys/Win32_Graphics_Gdi",
  "windows-sys/Win32_UI_WindowsAndMessaging",
]

[dependencies]
ash = { version = "=0.38.0", default-features = false, features = ["std"], optional = true }
rsf-game-sys = { path = "../../sdk/game" }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
], optional = true }

[lints]
workspace = true
