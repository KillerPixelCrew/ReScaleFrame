[package]
name = "rsf-game-sdk-fixtures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
unity-sr-d3d12-fixture = [
  "dep:windows", "windows-sys/Win32_System_Performance",
  "windows-sys/Win32_System_Threading", "windows-sys/Win32_System_WindowsProgramming",
]
xell-fixture = ["windows-sys/Win32_Security", "windows-sys/Win32_System_Threading"]
vk-latency-fixtures = ["dep:ash", "windows-sys/Win32_System_Performance", "windows-sys/Win32_System_Threading", "windows-sys/Win32_UI_WindowsAndMessaging"]
fg-cpu-fixture = ["windows-sys/Win32_System_Performance", "windows-sys/Win32_System_Threading"]
cpu-fixtures = ["windows-sys/Win32_System_Memory", "windows-sys/Win32_System_SystemInformation"]
d3d11-host-fixture = []
plugin-session-fixture = []
render-host-fixtures = ["windows-sys/Win32_System_Performance", "windows-sys/Win32_System_WindowsProgramming"]

[lib]
crate-type = ["staticlib"]
# A CMake fixture archive. Its unit-test harness would link the Runtime and adapter crates it
# takes bindings from, with all their native imports.
test = false

[target.'cfg(windows)'.dependencies]
ash = { workspace = true, optional = true }
rsf-anomaly = { path = "../../games/anomaly" }
rsf-game-sys = { path = "../../sdk/game" }
rsf-orchestrator = { path = "../../runtime/orchestrator" }
rsf-unity = { path = "../../integrations/unity" }
windows = { workspace = true, optional = true, features = [
  "std",
  "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Security",
  "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemServices",
] }

[build-dependencies]
rsf-bindgen = { path = "../../tools/bindgen" }

[lints]
workspace = true
