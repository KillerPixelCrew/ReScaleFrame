[package]
name = "rsf-rdr2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
# rlib so the Unity SR D3D12 fixture's archive can carry the runtime setup it calls.
crate-type = ["staticlib", "rlib"]

[features]
# The F10 frame capture, camera and native-settings probes, D3D12 trace, vendor census, module
# dumps and RenderDoc frame probe: research tooling for developer builds, never in release.
research = []
camera-fixture = []
capture-fixture = ["research", "dep:rsf-test-support", "windows/Win32_Graphics_Direct3D_Fxc"]

[dependencies]
rsf-game-sys = { path = "../../sdk/game" }

[target."cfg(windows)".dependencies]
# The vendor census and module dumps the ASI links call rsf-loader; this archive carries it so the ASI
# links one Rust archive (RSF_EMBEDDED_ARCHIVES).
rsf-loader = { path = "../../loader" }
rsf-minhook-sys = { path = "../../third_party/minhook" }
rsf-windows = { path = "../../integrations/windows" }
# The capture fixture's WARP D3D12 device; absent from the shipping build.
rsf-test-support = { path = "../../tests/support", optional = true }

[target."cfg(windows)".dependencies.windows]
workspace = true
features = [
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
]

[target."cfg(windows)".dependencies.windows-sys]
workspace = true
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_SystemInformation",
  "Win32_System_Performance",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
rsf-bindgen = { path = "../../tools/bindgen" }

[lints]
workspace = true
