[package]
name = "rsf-anomaly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib"]

[features]
fg-fixture = ["windows/Win32_Graphics_Dxgi"]
input-hook-fixture = []
overlay-device-fixture = [
  "windows/Win32_Devices_HumanInterfaceDevice",
  "windows/Win32_Graphics_Dxgi",
  "windows/Win32_Graphics_Imaging",
  "windows/Win32_System_Com",
]
motion-hooks-fixture = []
motion-binder-fixture = []
motion-device-fixture = ["windows/Win32_Graphics_Dxgi"]
native-entry = []
native-hook-fixture = []
sr-fixtures = ["windows/Win32_Graphics_Dxgi"]

[dependencies]
rsf-game-sys = { path = "../../sdk/game" }

[target."cfg(windows)".dependencies]
rsf-shader-compiler = { path = "../../runtime/shader_patch/compiler", default-features = false }
windows = { version = "0.62.2", default-features = false, features = [
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi_Common",
] }

[target."cfg(windows)".dependencies.windows-sys]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Performance",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[lints]
workspace = true

[target."cfg(windows)".dev-dependencies]
windows = { version = "0.62.2", default-features = false, features = [
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
] }
