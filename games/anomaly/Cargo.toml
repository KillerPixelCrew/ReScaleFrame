[package]
name = "rsf-anomaly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
# rlib so tests/game-sdk can use the observer records this crate binds.
crate-type = ["staticlib", "rlib"]

[features]
fg-fixture = ["dep:rsf-test-support", "windows/Win32_Graphics_Dxgi"]
input-hook-fixture = []
overlay-device-fixture = [
  "dep:rsf-test-support",
  "windows/std",
  "windows/Win32_Devices_HumanInterfaceDevice",
  "windows/Win32_Graphics_Dxgi",
  "windows/Win32_Graphics_Imaging",
  "windows/Win32_System_Com",
]
motion-hooks-fixture = []
motion-binder-fixture = []
motion-device-fixture = [
  "dep:rsf-test-support",
  "windows/Win32_Graphics_Direct3D_Fxc",
  "windows/Win32_Graphics_Dxgi",
  "windows-sys/Win32_System_Kernel",
]
native-entry = []
native-hook-fixture = []
sr-fixtures = ["dep:rsf-test-support", "windows/Win32_Graphics_Dxgi"]

[dependencies]
rsf-game-sys = { path = "../../sdk/game" }

[target."cfg(windows)".dependencies]
rsf-windows = { path = "../../integrations/windows" }
rsf-shader-compiler = { path = "../../runtime/shader_patch/compiler" }
# The fixtures' D3D11 devices and WARP swap chain; absent from the shipping build.
rsf-test-support = { path = "../../tests/support", optional = true }
windows = { workspace = true, features = [
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi_Common",
] }

[target."cfg(windows)".dependencies.windows-sys]
workspace = true
features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Performance",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
rsf-bindgen = { path = "../../tools/bindgen" }

[lints]
workspace = true

[target."cfg(windows)".dev-dependencies]
# The device examples' D3D11 device helper.
rsf-test-support = { path = "../../tests/support" }
windows = { workspace = true, features = [
  "std",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
] }
