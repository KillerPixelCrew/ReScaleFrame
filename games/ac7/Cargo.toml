[package]
name = "rsf-ac7"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
# rlib so tests/ac7-capture and the standalone AC7 fixtures can use the bindings it owns, and for
# the capture fixture's unit-test link.
crate-type = ["staticlib", "rlib"]

[features]
warp-fixture = []

[dependencies]
rsf-game-sys = { path = "../../sdk/game" }
# MinHook.h for the capture trampolines; the adapter DLL links CMake's MinHook.
rsf-minhook-sys = { path = "../../third_party/minhook" }

[build-dependencies]
cc.workspace = true
rsf-bindgen = { path = "../../tools/bindgen" }

[target."cfg(windows)".dependencies]
rsf-windows = { path = "../../integrations/windows" }
windows = { workspace = true, features = [
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Performance",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
rsf-shader-compiler = { path = "../../runtime/shader_patch/compiler" }

[target."cfg(windows)".dev-dependencies]
# Unit tests link the D3D11 leaves the adapter DLL gets from CMake.
rsf-graphics = { path = "../../runtime/graphics/rust" }

[lints]
workspace = true
