[package]
name = "rsf-unity-mono"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib"]

[features]
mono-plugin = ["dep:rsf-windows"]

[dependencies]
rsf-game-sys = { path = "../../sdk/game" }
rsf-runtime-submission = { path = "../../runtime/graphics/submission" }

[target."cfg(windows)".dependencies]
ash = { version = "=0.38.0", default-features = false, features = ["std"] }
windows = { version = "0.62.2", default-features = false, features = [
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Security",
] }
rsf-windows = { path = "../../integrations/windows", optional = true }

[target."cfg(windows)".dependencies.windows-sys]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Environment",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_Performance",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Input",
  "Win32_UI_WindowsAndMessaging",
]

[lints]
workspace = true
