[package]
name = "rsf-unity-mono"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib"]

[dependencies]
rsf-unity = { path = "../../integrations/unity", features = ["mono-plugin"] }
rsf-windows = { path = "../../integrations/windows" }
rsf-game-sys = { path = "../../sdk/game" }

[target."cfg(windows)".dependencies]
windows = { workspace = true, features = ["Win32_Graphics_Direct3D12"] }

[target."cfg(windows)".dependencies.windows-sys]
workspace = true
features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
]

# Unit tests link the Runtime the plugins get from CMake.
[target."cfg(windows)".dev-dependencies]
rsf-orchestrator = { path = "../../runtime/orchestrator" }
rsf-runtime-common = { path = "../../runtime/common" }

[lints]
workspace = true
