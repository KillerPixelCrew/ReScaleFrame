[package]
name = "rsf-skyrim-se"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib"]

[dependencies]
rsf-game-sys = { path = "../../sdk/game" }
rsf-steam = { path = "../../integrations/steam" }
rsf-windows = { path = "../../integrations/windows" }
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Threading",
] }
winapi = { version = "=0.3.9", features = ["d3d11", "dxgi", "processthreadsapi", "profileapi", "winuser"] }

[features]
# rsf_skyrim_input_fixture, called by the skyrim_input ctest executable; the plugin archive is built without it.
fixtures = []

[build-dependencies]
rsf-bindgen = { path = "../../tools/bindgen" }
cc.workspace = true

[lints]
workspace = true
