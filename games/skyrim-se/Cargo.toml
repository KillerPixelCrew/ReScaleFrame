[package]
name = "rsf-skyrim-se"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib"]

[dependencies]
rsf-game-sys = { path = "../../sdk/game" }
rsf-steam = { path = "../../integrations/steam" }
rsf-windows = { path = "../../integrations/windows" }
windows = { workspace = true, features = [
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
] }
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Performance",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[features]
# rsf_skyrim_input_fixture, called by the skyrim_input ctest executable; the plugin archive is built without it.
fixtures = []

[build-dependencies]
rsf-bindgen = { path = "../../tools/bindgen" }
cc.workspace = true

[lints]
workspace = true
