[package]
name = "rsf-orchestrator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
# rlib so the test crates and the standalone fixtures can use the bindings this crate owns, and for
# the unit tests of adapters whose CMake binaries link the Runtime.
crate-type = ["staticlib", "rlib"]

[dependencies]
rsf-fsr4-compat = { path = "../backends/fsr/compat" }
rsf-game-sys = { path = "../../sdk/game" }
rsf-streamline-vk = { path = "../vulkan/streamline/lifecycle" }
rsf-graphics = { path = "../graphics/rust" }
rsf-minhook-sys = { path = "../../third_party/minhook" }
rsf-runtime-submission = { path = "../graphics/submission" }

[dev-dependencies]
rsf-graphics = { path = "../graphics/rust", features = ["test-support"] }
# Unit tests link the common helpers the Runtime DLL gets from its CMake archive.
rsf-runtime-common = { path = "../common" }

[build-dependencies]
cc = "1"
rsf-bindgen = { path = "../../tools/bindgen" }

[lints]
workspace = true

[target."cfg(windows)".dependencies]
ash = { version = "=0.38.0", default-features = false, features = ["std"] }
rsf-shader-compiler = { path = "../shader_patch/compiler", default-features = false }
windows = { version = "0.62.2", default-features = false, features = [
  "std",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D11on12",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Imaging",
  "Win32_Security",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_WindowsProgramming",
  "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61", features = [
  "Win32_Graphics_Gdi",
  "Win32_Graphics_OpenGL",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Security_WinTrust",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Environment",
  "Win32_System_DataExchange",
  "Win32_System_Kernel",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Performance",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_Pointer",
  "Win32_UI_Input_Touch",
  "Win32_UI_WindowsAndMessaging",
] }
