[package]
name = "rsf-orchestrator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib"]

[dependencies]
rsf-game-sys = { path = "../../sdk/game" }

[build-dependencies]
cc = "1"

[lints]
workspace = true

[target."cfg(windows)".dependencies]
ash = { version = "=0.38.0", default-features = false, features = ["std"] }
rsf-shader-compiler = { path = "../shader_patch/compiler", default-features = false }
windows = { version = "0.62.2", default-features = false, features = [
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Dxgi",
] }
windows-sys = { version = "0.61", features = [
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Environment",
  "Win32_System_Kernel",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Performance",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_Pointer",
  "Win32_UI_Input_Touch",
  "Win32_UI_WindowsAndMessaging",
] }
