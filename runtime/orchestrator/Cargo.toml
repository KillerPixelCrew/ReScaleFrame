[package]
name = "rsf-orchestrator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib"]

[dependencies]
rsf-game-sys = { path = "../../sdk/game" }

[build-dependencies]
cc = "1"

[lints]
workspace = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_Security_Cryptography", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_UI_WindowsAndMessaging"] }
